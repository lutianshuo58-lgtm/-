<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国石油大学专业匹配测试</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    font-family:"PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f3fb;
    color: #333;
    min-height: 100vh;
    overflow-x: hidden;
}
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
@keyframes float {
    0%,100% {transform: translateY(0);}
    50% {transform: translateY(-8px);}
}
.page{display:none; animation: fadeIn 0.6s ease;}
.active{display:block;}
.header{
    background: linear-gradient(90deg, #9d65c9, #7b4bb8);
    color: white;
    padding: 16px 20px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
    position: relative;
}
.back-btn{
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: white;
    font-size: 20px;
    cursor: pointer;
}
.cover{
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
}
.cover-title{
    text-align: center;
    margin: 30px 0 10px;
    font-size: 28px;
    color: #5a348b;
    font-weight: bold;
}
.cover-subtitle{
    text-align: center;
    color: #8c6bc0;
    font-size: 16px;
    margin-bottom: 40px;
}
.version-cards{
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 40px;
}
.version-card{
    background: white;
    border-radius: 16px;
    padding: 30px 20px;
    width: 280px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(157, 101, 201, 0.1);
    position: relative;
}
.recommend-tag{
    position: absolute;
    top: -10px;
    right: 20px;
    background: #9d65c9;
    color: white;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
}
.version-icon{
    font-size: 32px;
    margin-bottom: 15px;
    color: #9d65c9;
}
.version-name{
    font-size: 20px;
    font-weight: 600;
    color: #5a348b;
    margin-bottom: 8px;
}
.version-desc{
    font-size: 14px;
    color: #999;
    margin-bottom: 20px;
}
.start-btn{
    background: linear-gradient(90deg, #9d65c9, #7b4bb8);
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s ease;
}
.start-btn:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(157, 101, 201, 0.2);
}
.major-gallery{
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 30px;
    box-shadow: 0 4px 12px rgba(157, 101, 201, 0.1);
}
.gallery-title{
    font-size: 20px;
    font-weight: 600;
    color: #5a348b;
    margin-bottom: 20px;
    text-align: center;
}
.major-grid{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}
.major-item{
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
}
.major-item:hover{
    transform: scale(1.05);
}
.major-icon{
    width: 60px;
    height: 60px;
    background: #f0e9fa;
    border-radius: 12px;
    margin: 0 auto 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #9d65c9;
}
.major-name{
    font-size: 12px;
    color: #666;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.view-more{
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #9d65c9;
    text-decoration: none;
    font-size: 15px;
    cursor: pointer;
}
.view-more:hover{
    text-decoration: underline;
}
.test-container{
    max-width: 700px;
    margin: 20px auto;
    padding: 0 20px;
}
.question-card{
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 4px 12px rgba(157, 101, 201, 0.1);
    margin-bottom: 20px;
}
.progress-bar{
    height: 8px;
    background: #eee;
    border-radius: 4px;
    margin-bottom: 15px;
    overflow: hidden;
}
.progress-fill{
    height: 100%;
    background: linear-gradient(90deg, #9d65c9, #7b4bb8);
    border-radius: 4px;
    transition: width 0.4s ease;
}
.progress-text{
    font-size: 14px;
    color: #999;
    margin-bottom: 20px;
    text-align: right;
}
.question-text{
    font-size: 18px;
    color: #333;
    line-height: 1.6;
    margin-bottom: 25px;
}
.answer-options{
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.answer-option{
    background: #f9f7fd;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 15px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
}
.answer-option:hover{
    background: #f0e9fa;
    border-color: #e1d4f5;
}
.answer-option input{
    display: none;
}
.answer-option.selected{
    background: #f0e9fa;
    border-color: #9d65c9;
}
.btn-group{
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}
.nav-btn{
    background: white;
    border: 1px solid #9d65c9;
    color: #9d65c9;
    padding: 10px 25px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    transition: all 0.3s ease;
}
.nav-btn:hover{
    background: #f0e9fa;
}
.nav-btn.primary{
    background: linear-gradient(90deg, #9d65c9, #7b4bb8);
    color: white;
    border: none;
}
.nav-btn.primary:hover{
    box-shadow: 0 6px 15px rgba(157, 101, 201, 0.2);
}
.nav-btn:disabled{
    background: #eee;
    color: #ccc;
    border-color: #eee;
    cursor: not-allowed;
}

/* ========== 修复：弹窗层级（关键修改） ========== */
.result-modal{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999; /* 完整图鉴在下层 */
    padding: 20px;
    pointer-events: auto;
}
/* 专业详情弹窗 最上层 */
#majorModal {
    z-index: 10000 !important;
}
/* 分享/历史 最最上层 */
#sharePosterModal, #historyModal {
    z-index: 10001 !important;
}

.modal-content{
    background: white;
    border-radius: 16px;
    max-width: 500px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 30px;
    position: relative;
    animation: fadeIn 0.4s ease;
    z-index: inherit;
}
.full-gallery-modal .modal-content {
    max-width: 800px;
    padding: 20px;
}
.full-gallery-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 15px;
    margin-top: 20px;
}
@media (max-width: 768px) {
    .full-gallery-grid {
        grid-template-columns: repeat(3, 1fr);
    }
}
@media (max-width: 480px) {
    .full-gallery-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
.close-btn{
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: none;
    font-size: 20px;
    color: #999;
    cursor: pointer;
    z-index: 10002;
}
.result-page{
    padding: 20px;
    max-width: 700px;
    margin: 0 auto;
}
.major-result-card{
    background: white;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 4px 12px rgba(157, 101, 201, 0.1);
    margin-bottom: 30px;
}
.major-icon-big{
    width: 100px;
    height: 100px;
    background: #f0e9fa;
    border-radius: 20px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #9d65c9;
    animation: float 4s ease-in-out infinite;
}
.major-result-name{
    font-size: 28px;
    color: #5a348b;
    font-weight: bold;
    margin-bottom: 8px;
}
.major-type{
    font-size: 16px;
    color: #9d65c9;
    margin-bottom: 25px;
}
.result-btn-group{
    display: flex;
    gap: 15px;
    justify-content: center;
    margin-bottom: 30px;
}
.result-btn{
    padding: 12px 25px;
    border-radius: 30px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.3s ease;
}
.result-btn.primary{
    background: linear-gradient(90deg, #9d65c9, #7b4bb8);
    color: white;
}
.result-btn.secondary{
    background: #f9f7fd;
    color: #9d65c9;
}
.result-section{
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 12px rgba(157, 101, 201, 0.1);
}
.section-title{
    font-size: 18px;
    color: #5a348b;
    font-weight: 600;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.section-title i{
    color: #f9d148;
}
.major-analysis{
    color: #666;
    line-height: 1.7;
    font-size: 15px;
    margin-bottom: 15px;
}
.funny-comment {
    background: #fff6e0;
    border: 1px solid #ffe082;
    border-radius: 12px;
    padding: 15px;
    margin-top: 15px;
    font-size: 15px;
    color: #e65100;
    font-weight: 500;
    line-height: 1.6;
}
.trait-tags{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}
.trait-tag{
    background: #f9f7fd;
    border: 1px solid #e1d4f5;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
    color: #5a348b;
    font-size: 15px;
}
.dimension-item{
    margin-bottom: 15px;
}
.dimension-label{
    display: flex;
    justify-content: space-between;
    margin-bottom: 5px;
    font-size: 14px;
}
.dimension-name{
    color: #666;
}
.dimension-value{
    color: #9d65c9;
    font-weight: 600;
}
.dimension-bar{
    height: 8px;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
}
.dimension-fill{
    height: 100%;
    background: linear-gradient(90deg, #9d65c9, #7b4bb8);
    border-radius: 4px;
}
.test-info{
    background: #f9f7fd;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
}
.info-item{
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 14px;
}
.info-item:last-child{
    border-bottom: none;
}
.info-label{
    color: #999;
}
.info-value{
    color: #666;
    font-weight: 500;
}
.retest-btn{
    display: block;
    width: 200px;
    margin: 0 auto;
    background: #f9f7fd;
    border: 1px solid e1d4f5;
    color: #9d65c9;
    padding: 12px;
    border-radius: 30px;
    font-size: 15px;
    cursor: pointer;
    text-align: center;
    transition: all 0.3s ease;
}
.retest-btn:hover{
    background: #f0e9fa;
}

/* ---------- 新增：分享海报样式 ---------- */
.poster-content {
    background: linear-gradient(160deg, #f5f3fb, #e9e2f7);
    border-radius: 20px;
    padding: 40px 30px;
    text-align: center;
    position: relative;
    overflow: hidden;
}
.poster-icon {
    width: 120px;
    height: 120px;
    background: white;
    border-radius: 24px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    color: #9d65c9;
    box-shadow: 0 8px 24px rgba(157,101,201,0.15);
}
.poster-title {
    font-size: 32px;
    font-weight: bold;
    color: #5a348b;
    margin-bottom: 8px;
}
.poster-sub {
    font-size: 16px;
    color: #8c6bc0;
    margin-bottom: 30px;
}
.poster-desc {
    font-size: 15px;
    color: #666;
    line-height: 1.7;
    margin-bottom: 30px;
    padding: 0 20px;
}
.poster-qr {
    width: 140px;
    height: 140px;
    margin: 0 auto 20px;
    background: white;
    border-radius: 12px;
    padding: 10px;
}
.poster-footer {
    font-size: 13px;
    color: #999;
    margin-top: 10px;
}
/* ---------- 新增：历史记录样式 ---------- */
.history-item {
    padding: 16px;
    border-bottom: 1px solid #f0e9fa;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.history-left {
    display: flex;
    align-items: center;
    gap: 12px;
}
.history-icon {
    width: 40px;
    height: 40px;
    background: #f0e9fa;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: #9d65c9;
}
.history-name {
    font-size: 16px;
    font-weight: 500;
    color: #5a348b;
}
.history-time {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
}
.history-right {
    font-size: 12px;
    color: #9d65c9;
    background: #f9f7fd;
    padding: 4px 10px;
    border-radius: 20px;
}
</style>
</head>
<body>

<div class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    中国石油大学专业匹配测试
</div>

<!-- 封面 -->
<div id="cover" class="page active">
    <div class="cover">
        <h1 class="cover-title">专业匹配测试</h1>
        <p class="cover-subtitle">发现最适合你的石油大学专业方向</p>
        
        <div class="version-cards">
            <div class="version-card">
                <div class="recommend-tag">推荐</div>
                <div class="version-icon">⚡</div>
                <div class="version-name">简约版</div>
                <div class="version-desc">20题 · 1-2分钟</div>
                <button class="start-btn" onclick="startTest('simple')">开始测试</button>
            </div>
            <div class="version-card">
                <div class="version-icon">⭐</div>
                <div class="version-name">完整版</div>
                <div class="version-desc">40题 · 2-3分钟</div>
                <button class="start-btn" onclick="startTest('full')">开始测试</button>
            </div>
        </div>

        <div class="major-gallery">
            <h2 class="gallery-title">热门专业图鉴</h2>
            <div class="major-grid">
                <div class="major-item" onclick="showMajorDetail('石油工程')"><div class="major-icon">⛽</div><div class="major-name">石油工程</div></div>
                <div class="major-item" onclick="showMajorDetail('计算机科学与技术')"><div class="major-icon">💻</div><div class="major-name">计算机科学</div></div>
                <div class="major-item" onclick="showMajorDetail('机械类')"><div class="major-icon">⚙️</div><div class="major-name">机械工程</div></div>
                <div class="major-item" onclick="showMajorDetail('化学工程与工艺')"><div class="major-icon">🧪</div><div class="major-name">化学工程</div></div>
                <div class="major-item" onclick="showMajorDetail('能源经济')"><div class="major-icon">💰</div><div class="major-name">能源经济</div></div>
                <div class="major-item" onclick="showMajorDetail('环境工程')"><div class="major-icon">🌱</div><div class="major-name">环境工程</div></div>
                <div class="major-item" onclick="showMajorDetail('自动化')"><div class="major-icon">🤖</div><div class="major-name">自动化</div></div>
                <div class="major-item" onclick="showMajorDetail('材料科学与工程')"><div class="major-icon">🧱</div><div class="major-name">材料工程</div></div>
            </div>
            <div class="view-more" onclick="showFullGallery()">查看完整图鉴 →</div>
        </div>
    </div>
</div>

<!-- 测试页 -->
<div id="test" class="page">
    <div class="test-container">
        <div class="question-card">
            <div class="progress-bar"><div id="progressFill" class="progress-fill" style="width:0%"></div></div>
            <div class="progress-text" id="progressText">第 1 / 40 题</div>
            <div id="questionText" class="question-text"></div>
            
            <div class="answer-options" id="answerOptions">
                <label class="answer-option"><input type="radio" name="ans" value="2"><span>非常符合</span></label>
                <label class="answer-option"><input type="radio" name="ans" value="1"><span>一般</span></label>
                <label class="answer-option"><input type="radio" name="ans" value="0"><span>不符合</span></label>
            </div>
            
            <div class="btn-group">
                <button class="nav-btn" onclick="prevQuestion()" id="prevBtn">上一题</button>
                <button class="nav-btn primary" onclick="nextQuestion()" id="nextBtn">下一题</button>
                <button class="nav-btn primary" onclick="submitTest()" id="submitBtn" style="display:none;">提交结果</button>
            </div>
        </div>
    </div>
</div>

<!-- 结果页 -->
<div id="resultPage" class="page">
    <div class="result-page">
        <div class="major-result-card">
            <div class="major-icon-big" id="resultIcon">⛽</div>
            <div class="major-result-name" id="resultMajor">石油工程</div>
            <div class="major-type" id="majorType">能源工程类</div>
            
            <div class="result-btn-group">
                <button class="result-btn primary" onclick="shareResult()">分享结果</button>
                <button class="result-btn secondary" onclick="viewHistory()">查看历史</button>
            </div>
        </div>

        <div class="result-section">
            <h3 class="section-title"><i>⭐</i> 专业解析</h3>
            <p class="major-analysis" id="majorAnalysis"></p>
            <div class="funny-comment" id="funnyComment"></div>
        </div>

        <div class="result-section">
            <h3 class="section-title"><i>⭐</i> 核心特质</h3>
            <div class="trait-tags" id="traitTagsBox"></div>
        </div>

        <div class="result-section">
            <h3 class="section-title"><i>📊</i> 四维度分析</h3>
            <div id="dimensionBox"></div>
        </div>

        <div class="test-info">
            <div class="info-item"><span class="info-label">测试版本</span><span class="info-value" id="testVersion"></span></div>
            <div class="info-item"><span class="info-label">完成时间</span><span class="info-value" id="completeTime"></span></div>
            <div class="info-item"><span class="info-label">回答题数</span><span class="info-value" id="questionCount"></span></div>
        </div>

        <button class="retest-btn" onclick="location.reload()">重新测试</button>
    </div>
</div>

<!-- 专业详情弹窗 -->
<div id="majorModal" class="result-modal" style="display:none">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">×</button>
        <div class="major-icon-big" id="modalIcon">⛽</div>
        <div class="major-result-name" id="modalName">石油工程</div>
        <p class="major-analysis" id="modalDesc"></p>
        <div class="trait-tags" id="modalTraitTags"></div>
    </div>
</div>

<!-- 完整图鉴弹窗 -->
<div id="fullGalleryModal" class="result-modal full-gallery-modal" style="display:none">
    <div class="modal-content">
        <button class="close-btn" onclick="closeFullGallery()">×</button>
        <h2 class="gallery-title">中国石油大学 - 完整专业图鉴</h2>
        <div class="full-gallery-grid" id="fullGalleryGrid"></div>
    </div>
</div>

<!-- 新增：分享海报弹窗 -->
<div id="sharePosterModal" class="result-modal" style="display:none">
    <div class="modal-content">
        <button class="close-btn" onclick="closeShareModal()">×</button>
        <div class="poster-content">
            <div class="poster-icon" id="posterIcon">⛽</div>
            <div class="poster-title" id="posterMajor">石油工程</div>
            <div class="poster-sub" id="posterType">能源工程类</div>
            <div class="poster-desc" id="posterDesc">你的专属专业匹配结果</div>
            <img id="posterQr" class="poster-qr" src="">
            <div class="poster-footer">长按保存 · 分享你的专属结果</div>
        </div>
    </div>
</div>

<!-- 新增：历史记录弹窗 -->
<div id="historyModal" class="result-modal" style="display:none">
    <div class="modal-content">
        <button class="close-btn" onclick="closeHistoryModal()">×</button>
        <h2 class="gallery-title" style="margin-bottom:20px">最近测试记录</h2>
        <div id="historyList"></div>
    </div>
</div>

<script>

/* ===== 核心逻辑 ===== */
let currentVersion = "simple";
let currentQuestions = simpleQuestions;
let currentQuestionIndex = 0;
let answers = [];
let scoreMap = {};
let lastResult = null;

function initScoreMap(){
    for(let m in allMajorsData) scoreMap[m] = 0;
}
function startTest(v){
    currentVersion = v;
    currentQuestions = v==="simple"?simpleQuestions:fullQuestions;
    currentQuestionIndex=0;
    answers = new Array(currentQuestions.length).fill(-1);
    initScoreMap();
    showPage("test");
    renderQuestion();
}
function renderQuestion(){
    const q = currentQuestions[currentQuestionIndex];
    document.getElementById("questionText").innerText = ` ${currentQuestionIndex+1}. ${q}`;
    document.getElementById("progressText").innerText = `第 ${currentQuestionIndex+1}/${currentQuestions.length} 题`;
    document.getElementById("progressFill").style.width = `${((currentQuestionIndex+1)/currentQuestions.length)*100}%`;
    document.querySelectorAll(".answer-option").forEach(o=>o.classList.remove("selected"));
    const v = answers[currentQuestionIndex];
    if(v!==-1){
        document.querySelector(`input[value="${v}"]`).checked=true;
        document.querySelector(`input[value="${v}"]`).closest(".answer-option").classList.add("selected");
    }
    document.getElementById("prevBtn").disabled = currentQuestionIndex===0;
    if(currentQuestionIndex === currentQuestions.length-1){
        document.getElementById("nextBtn").style.display="none";
        document.getElementById("submitBtn").style.display="inline-block";
    }else{
        document.getElementById("nextBtn").style.display="inline-block";
        document.getElementById("submitBtn").style.display="none";
    }
}
document.querySelectorAll(".answer-option").forEach(opt=>{
    opt.addEventListener("click",()=>{
        document.querySelectorAll(".answer-option").forEach(o=>o.classList.remove("selected"));
        opt.classList.add("selected");
        answers[currentQuestionIndex] = parseInt(opt.querySelector("input").value);
    });
});
function prevQuestion(){if(currentQuestionIndex>0){currentQuestionIndex--;renderQuestion();}}
function nextQuestion(){
    if(answers[currentQuestionIndex]===-1){alert("请选择答案");return;}
    if(currentQuestionIndex < currentQuestions.length-1){currentQuestionIndex++;renderQuestion();}
}
function submitTest(){
    if(answers.includes(-1)){alert("请完成所有题目");return;}
    calculateResult();
}
function calculateResult(){
    for(let i=0;i<answers.length;i++){
        const s=answers[i];
        if(i===0||i===8)scoreMap["石油工程"]+=s;
        if(i===1||i===12)scoreMap["资源勘查工程"]+=s;
        if(i===3||i===20)scoreMap["机械类"]+=s;
        if(i===4||i===23)scoreMap["化学工程与工艺"]+=s;
        if(i===6||i===15)scoreMap["数据科学与大数据技术"]+=s;
        if(i===13||i===18)scoreMap["计算机科学与技术"]+=s;
        if(i===14||i===19)scoreMap["自动化"]+=s;
        if(i===22||i===25)scoreMap["能源经济"]+=s;
        if(i===2||i===39)scoreMap["环境工程"]+=s;
        if(i===7||i===21)scoreMap["油气储运工程"]+=s;
        if(i===5||i===16)scoreMap["材料科学与工程"]+=s;
        if(i===9||i===17)scoreMap["新能源科学与工程"]+=s;
        if(i===10||i===24)scoreMap["工商管理类"]+=s;
        if(i===11||i===26)scoreMap["安全工程"]+=s;
    }
    let max=-1,best="石油工程";
    for(let m in scoreMap){if(scoreMap[m]>max){max=scoreMap[m];best=m;}}
    showResult(best);
}

function showResult(major){
    const d=allMajorsData[major];
    document.getElementById("resultIcon").innerText=d.icon;
    document.getElementById("resultMajor").innerText=major;
    document.getElementById("majorType").innerText=d.type;
    document.getElementById("majorAnalysis").innerText=d.desc;
    document.getElementById("funnyComment").innerText=d.funnyComment;
    document.getElementById("testVersion").innerText=currentVersion==="simple"?"简约版":"完整版";
    document.getElementById("questionCount").innerText=currentQuestions.length+"题";
    const time = new Date().toLocaleString();
    document.getElementById("completeTime").innerText=time;

    const t=document.getElementById("traitTagsBox");t.innerHTML="";
    d.traits.forEach(x=>{const div=document.createElement("div");div.className="trait-tag";div.innerText=x;t.appendChild(div);});
    document.getElementById("dimensionBox").innerHTML=`
    <div class="dimension-item"><div class="dimension-label"><span>工程能力</span><span>${d.dim.eng}/10</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${d.dim.eng*10}%"></div></div></div>
    <div class="dimension-item"><div class="dimension-label"><span>科研潜力</span><span>${d.dim.research}/10</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${d.dim.research*10}%"></div></div></div>
    <div class="dimension-item"><div class="dimension-label"><span>实践适配</span><span>${d.dim.practice}/10</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${d.dim.practice*10}%"></div></div></div>
    <div class="dimension-item"><div class="dimension-label"><span>专业匹配</span><span>${d.dim.match}/10</span></div><div class="dimension-bar"><div class="dimension-fill" style="width:${d.dim.match*10}%"></div></div></div>`;
    
    lastResult = {major,icon:d.icon,type:d.type,time:time,version:currentVersion==="simple"?"简约版":"完整版"};
    saveHistory(lastResult);
    showPage("resultPage");
}

function showPage(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}
function goBack(){
    if(document.getElementById("test").classList.contains("active"))showPage("cover");
    else if(document.getElementById("resultPage").classList.contains("active"))showPage("cover");
}
function showMajorDetail(m){
    const d=allMajorsData[m];
    document.getElementById("modalIcon").innerText=d.icon;
    document.getElementById("modalName").innerText=m;
    document.getElementById("modalDesc").innerText=d.modalDesc;
    const t=document.getElementById("modalTraitTags");t.innerHTML="";
    d.traits.forEach(x=>{const div=document.createElement("div");div.className="trait-tag";div.innerText=x;t.appendChild(div);});
    document.getElementById("majorModal").style.display="flex";
}
function closeModal(){document.getElementById("majorModal").style.display="none";}
function showFullGallery(){
    const g=document.getElementById("fullGalleryGrid");g.innerHTML="";
    for(let m in allMajorsData){
        const d=allMajorsData[m];
        const i=document.createElement("div");i.className="major-item";
        i.onclick=()=>showMajorDetail(m);
        i.innerHTML=`<div class="major-icon">${d.icon}</div><div class="major-name">${m}</div>`;
        g.appendChild(i);
    }
    document.getElementById("fullGalleryModal").style.display="flex";
}
function closeFullGallery(){document.getElementById("fullGalleryModal").style.display="none";}

/* ====================== 新增：分享海报功能 ====================== */
function shareResult(){
    if(!lastResult){alert("请先完成测试");return;}
    const d=allMajorsData[lastResult.major];
    document.getElementById("posterIcon").innerText = d.icon;
    document.getElementById("posterMajor").innerText = lastResult.major;
    document.getElementById("posterType").innerText = lastResult.type;
    document.getElementById("posterDesc").innerText = d.desc.length>60?d.desc.substring(0,60)+"...":d.desc;
    // 生成二维码（在线API）
    const url = encodeURIComponent(window.location.href || "https://www.cup.edu.cn/");
    document.getElementById("posterQr").src = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=${url}&color=9D65C9`;
    document.getElementById("sharePosterModal").style.display = "flex";
}
function closeShareModal(){
    document.getElementById("sharePosterModal").style.display = "none";
}

/* ====================== 新增：历史记录功能 ====================== */
function saveHistory(record){
    let list = JSON.parse(localStorage.getItem("majorHistory") || "[]");
    list.unshift(record);
    if(list.length>5) list = list.slice(0,5);
    localStorage.setItem("majorHistory",JSON.stringify(list));
}
function viewHistory(){
    const list = JSON.parse(localStorage.getItem("majorHistory") || "[]");
    const box = document.getElementById("historyList");
    box.innerHTML = "";
    if(list.length===0){
        box.innerHTML = `<div style="text-align:center;padding:40px 0;color:#999">暂无历史记录</div>`;
    }else{
        list.forEach(item=>{
            const div = document.createElement("div");
            div.className = "history-item";
            div.innerHTML = `
            <div class="history-left">
                <div class="history-icon">${item.icon}</div>
                <div>
                    <div class="history-name">${item.major}</div>
                    <div class="history-time">${item.time}</div>
                </div>
            </div>
            <div class="history-right">${item.version}</div>`;
            box.appendChild(div);
        });
    }
    document.getElementById("historyModal").style.display = "flex";
}
function closeHistoryModal(){
    document.getElementById("historyModal").style.display = "none";
}
</script>
